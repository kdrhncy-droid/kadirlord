<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1e1710" />
      <stop offset="100%" stopColor="#0d0c0a" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fde68a" />
      <stop offset="45%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="50%" stopColor="#cbd5e1" />
      <stop offset="100%" stopColor="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Crest Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Crossed Swords -->
  <g filter="url(#glow)">
    <!-- Sword 1 (Bottom-Left to Top-Right) -->
    <path d="M120 392 L360 152 L384 128 L360 104 L336 128 L144 320 Z" fill="url(#bladeGrad)" />
    <path d="M112 368 L144 400 M128 384 L100 412 M92 404 L84 428 L108 420 Z" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="url(#goldGrad)" />

    <!-- Sword 2 (Bottom-Right to Top-Left) -->
    <path d="M392 392 L152 152 L128 128 L152 104 L176 128 L368 320 Z" fill="url(#bladeGrad)" />
    <path d="M400 368 L368 400 M384 384 L412 412 M420 404 L428 428 L404 420 Z" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="url(#goldGrad)" />
  </g>

  <!-- Shield / Crest Core -->
  <path d="M256 160 L330 200 C330 310 256 360 256 360 C256 360 182 310 182 200 Z" fill="#18120c" stroke="url(#goldGrad)" stroke-width="7" filter="url(#glow)" />

  <!-- Crown / Banner Sigil -->
  <path d="M220 280 L232 230 L256 255 L280 230 L292 280 Z" fill="url(#goldGrad)" />
  <circle cx="232" cy="224" r="4" fill="#fde68a" />
  <circle cx="256" cy="248" r="4" fill="#fde68a" />
  <circle cx="280" cy="224" r="4" fill="#fde68a" />

  <!-- Banner Star / Jewel -->
  <polygon points="256,190 262,204 276,204 265,213 269,227 256,218 243,227 247,213 236,204 250,204" fill="#fde68a" />
</svg>
